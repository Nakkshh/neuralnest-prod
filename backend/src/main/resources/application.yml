server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:${DATABASE_URL}?sslmode=require&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        timezone:
          default_storage: NORMALIZE_UTC
  security:
    jwt:
      secret: ${SPRING_SECURITY_JWT_SECRET:default-local-secret}

logging:
  level:
    org.springframework.web: INFO
    com.neuralnest: INFO