server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/neuralnest?useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
    username: postgres
    password: neuralnest123
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        timezone:
          default_storage: NORMALIZE_UTC  # Changed from 'UTC' to valid enum value
          # Removed 'default_retrieval: UTC' as it's not a valid property in Hibernate 6.x

spring.security.jwt.secret: your-very-long-secret-key-here-32chars-minimum-abc123xyz

logging:
  level:
    org.springframework.web: DEBUG
    com.neuralnest: DEBUG